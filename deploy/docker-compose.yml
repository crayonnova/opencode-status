services:
  opencode-status:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opencode-status:latest
    container_name: opencode-status
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    environment:
      OPENCODE_STATUS_DB: /data/history.db
      OPENCODE_STATUS_WEB: ":8080"
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/opencode-status", "--version"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
